  <line x1="60" y1="108" x2="1860" y2="108" stroke="#e2e8f0"/>
  <text x="68" y="57" class="title">Production-scale vacation-rental marketplace</text>
  <text x="68" y="86" class="subtitle">Global, event-driven architecture for discovery, bookings, payments and reliable host–guest experiences</text>
  <rect x="1585" y="35" width="265" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1610" y="59" class="small" fill="#047857">MULTI-REGION • AUTO-SCALING</text>

  <text x="68" y="151" class="lane">EXPERIENCE &amp; GLOBAL EDGE</text>
  <rect x="50" y="172" width="1820" height="178" rx="22" fill="#edf6ff" stroke="#c9e2fa"/>
  <rect x="78" y="208" width="184" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="110" cy="242" r="16" fill="#dbeafe"/><path d="M101 248c3-10 15-10 18 0M105 237a5 5 0 1 0 10 0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="137" y="241" class="card-title">Guests &amp; hosts</text><text x="137" y="265" class="card-text">Web and mobile apps</text><text x="96" y="291" class="small">Accessible, localized UI</text>
  <rect x="330" y="208" width="200" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="362" cy="242" r="16" fill="#dbeafe"/><path d="M352 242h20M362 232c5 5 5 15 0 20M362 232c-5 5-5 15 0 20" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="389" y="241" class="card-title">DNS, CDN &amp; WAF</text><text x="356" y="266" class="card-text">TLS, DDoS protection, image cache</text><text x="356" y="291" class="small">Anycast routing • edge cache</text>
  <rect x="598" y="208" width="250" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="630" cy="242" r="16" fill="#fce7f3"/><path d="M622 250l8-16 8 16M625 244h10" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <text x="657" y="241" class="card-title">Frontend delivery</text><text x="624" y="266" class="card-text">React web • native mobile • BFF</text><text x="624" y="291" class="small">SSR / static assets • feature flags</text>
  <rect x="916" y="208" width="238" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
