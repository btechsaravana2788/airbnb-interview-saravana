  <text x="68" y="726" class="lane">DATA, SEARCH &amp; ASYNCHRONOUS PROCESSING</text>
  <rect x="50" y="747" width="1820" height="166" rx="22" fill="#f6f4ff" stroke="#ddd6fe"/>
  <rect x="83" y="782" width="286" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="106" y="816" class="card-title">PostgreSQL / Aurora</text><text x="106" y="841" class="card-text">Multi-AZ primary • read replicas</text><text x="106" y="862" class="small">Listings, users, bookings, payouts</text>
  <rect x="411" y="782" width="245" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="434" y="816" class="card-title">Redis cluster</text><text x="434" y="841" class="card-text">Sessions, cached reads, locks</text><text x="434" y="862" class="small">Availability hold protection</text>
  <rect x="698" y="782" width="257" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="721" y="816" class="card-title">OpenSearch</text><text x="721" y="841" class="card-text">Geo index, facets and ranking</text><text x="721" y="862" class="small">Cross-zone replicas</text>
  <rect x="997" y="782" width="270" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1020" y="816" class="card-title">Object storage</text><text x="1020" y="841" class="card-text">Photos, videos, documents, backups</text><text x="1020" y="862" class="small">Lifecycle policies • CDN origin</text>
  <rect x="1309" y="782" width="235" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1332" y="816" class="card-title">Event stream</text><text x="1332" y="841" class="card-text">Kafka / SQS event backbone</text><text x="1332" y="862" class="small">Outbox • retries • DLQs</text>
  <rect x="1586" y="782" width="251" height="95" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1609" y="816" class="card-title">Analytics lakehouse</text><text x="1609" y="841" class="card-text">BI, ML features, experimentation</text><text x="1609" y="862" class="small">Governed, de-identified data</text>
  <path d="M190 619V782" class="arrow"/><path d="M694 619V731H534V782" class="arrow"/><path d="M442 619V731H826V782" class="arrow"/><path d="M1450 619V782" class="arrow"/><path d="M946 619V742H1426V782" class="arrow"/><path d="M1450 619V742H1711V782" class="dashed"/>

  <text x="68" y="959" class="lane">RELIABLE DEPLOYMENT &amp; OPERATIONS</text>
  <rect x="50" y="980" width="1820" height="66" rx="18" fill="#172033"/>
  <text x="88" y="1020" fill="#ffffff" style="font:700 17px Arial, Helvetica, sans-serif">Private source control → CI quality gates → signed artifacts → canary / blue-green deployment</text>
  <line x1="825" y1="994" x2="825" y2="1032" stroke="#475569"/><text x="852" y="1008" fill="#e2e8f0" style="font:600 13px Arial, Helvetica, sans-serif">Kubernetes / ECS across regions &amp; availability zones</text><text x="852" y="1029" fill="#94a3b8" style="font:400 12px Arial, Helvetica, sans-serif">Horizontal autoscaling • infrastructure as code • secrets manager • disaster recovery drills</text>
  <line x1="1420" y1="994" x2="1420" y2="1032" stroke="#475569"/><text x="1447" y="1008" fill="#e2e8f0" style="font:600 13px Arial, Helvetica, sans-serif">SLO-driven operations</text><text x="1447" y="1029" fill="#94a3b8" style="font:400 12px Arial, Helvetica, sans-serif">Alerting • runbooks • audit logs</text>
