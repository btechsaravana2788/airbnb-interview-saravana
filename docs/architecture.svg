<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Production-scale vacation rental marketplace architecture</title>
  <desc id="description">A high-level architecture showing the browser clients, global edge, application services, data stores, asynchronous processing and deployment platform used to operate a global vacation-rental marketplace.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7280"/></marker>
    <style>
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #64748b; }
      .lane { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #475569; }
      .card-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #172033; }
      .card-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #526174; }
      .small { font: 600 12px Arial, Helvetica, sans-serif; fill: #526174; }
      .tag { font: 700 11px Arial, Helvetica, sans-serif; fill: #24435d; letter-spacing: .4px; }
      .arrow { fill: none; stroke: #718096; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #9aa8b8; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
