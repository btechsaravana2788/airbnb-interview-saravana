  <text x="68" y="397" class="lane">CORE MARKETPLACE SERVICES</text>
  <rect x="50" y="418" width="1820" height="261" rx="22" fill="#ffffff" stroke="#dce5ef"/>
  <rect x="81" y="453" width="218" height="166" rx="15" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="101" y="472" width="73" height="22" rx="11" fill="#dcfce7"/><text x="114" y="487" class="tag">DISCOVER</text>
  <text x="101" y="522" class="card-title">Listing service</text><text x="101" y="547" class="card-text">Homes, hosts, amenities,</text><text x="101" y="568" class="card-text">policies and availability views</text><text x="101" y="600" class="small">Write API • read projection</text>
  <rect x="333" y="453" width="218" height="166" rx="15" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="353" y="472" width="73" height="22" rx="11" fill="#dcfce7"/><text x="366" y="487" class="tag">DISCOVER</text>
  <text x="353" y="522" class="card-title">Search &amp; ranking</text><text x="353" y="547" class="card-text">Geo search, filters,</text><text x="353" y="568" class="card-text">personalization and maps</text><text x="353" y="600" class="small">Low-latency query API</text>
  <rect x="585" y="453" width="218" height="166" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="605" y="472" width="85" height="22" rx="11" fill="#ffedd5"/><text x="617" y="487" class="tag">TRANSACT</text>
  <text x="605" y="522" class="card-title">Booking engine</text><text x="605" y="547" class="card-text">Availability holds, quotes,</text><text x="605" y="568" class="card-text">reservations and cancellations</text><text x="605" y="600" class="small">Idempotent workflow</text>
  <rect x="837" y="453" width="218" height="166" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="857" y="472" width="85" height="22" rx="11" fill="#ffedd5"/><text x="869" y="487" class="tag">TRANSACT</text>
  <text x="857" y="522" class="card-title">Pricing &amp; payments</text><text x="857" y="547" class="card-text">Fees, taxes, payouts,</text><text x="857" y="568" class="card-text">payment orchestration</text><text x="857" y="600" class="small">PCI token provider</text>
  <rect x="1089" y="453" width="218" height="166" rx="15" fill="#fdf4ff" stroke="#f5d0fe"/>
  <rect x="1109" y="472" width="76" height="22" rx="11" fill="#fae8ff"/><text x="1121" y="487" class="tag">ENGAGE</text>
  <text x="1109" y="522" class="card-title">Messaging &amp; reviews</text><text x="1109" y="547" class="card-text">Chat, notifications,</text><text x="1109" y="568" class="card-text">reviews and moderation</text><text x="1109" y="600" class="small">Realtime + async delivery</text>
  <rect x="1341" y="453" width="218" height="166" rx="15" fill="#fdf4ff" stroke="#f5d0fe"/>
  <rect x="1361" y="472" width="76" height="22" rx="11" fill="#fae8ff"/><text x="1373" y="487" class="tag">ENGAGE</text>
  <text x="1361" y="522" class="card-title">Media pipeline</text><text x="1361" y="547" class="card-text">Uploads, virus scan,</text><text x="1361" y="568" class="card-text">image/video transforms</text><text x="1361" y="600" class="small">Signed direct uploads</text>
  <rect x="1593" y="453" width="216" height="166" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1613" y="492" class="card-title">Admin &amp; support</text><text x="1613" y="522" class="card-text">Disputes, refunds, safety</text><text x="1613" y="544" class="card-text">and operations tooling</text><text x="1613" y="580" class="small">Audited access controls</text>
