  <text x="975" y="241" class="card-title">API gateway</text><text x="942" y="266" class="card-text">Rate limits, auth, routing, versioning</text><text x="942" y="291" class="small">REST / GraphQL • request tracing</text>
  <rect x="1222" y="208" width="286" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
