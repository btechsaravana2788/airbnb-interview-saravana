  <rect x="1576" y="208" width="260" height="104" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1600" y="241" class="card-title">Observability</text><text x="1600" y="266" class="card-text">Logs, traces, metrics, alerts</text><text x="1600" y="291" class="small">SLOs • real-user monitoring</text>

